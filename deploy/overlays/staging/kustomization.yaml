apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments
resources:
  - ../../base
labels:
  - pairs:
      env: staging
    includeSelectors: false
# release.yaml: which commit/PR this image came from. CI rewrites it on every PR
# push; Argo Rollouts notifications forward it to the AI SRE.
patches:
  - path: release.yaml
images:
  - name: payment
    newName: ghcr.io/shivaylamba/scn-payment
    newTag: sha-1e4a2ab
  - name: inventory
    newName: ghcr.io/shivaylamba/scn-inventory
    newTag: v1.0.0
  - name: loadgen
    newName: ghcr.io/shivaylamba/scn-loadgen
    newTag: v1.0.0
configMapGenerator:
  - name: loadgen
    envs:
      - loadgen.env
