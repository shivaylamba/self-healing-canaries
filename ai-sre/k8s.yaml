# AI SRE in the staging (management) cluster.
#   ai-sre       FastAPI: Rollouts webhook, SQLite release ledger (+ its MCP server at /ledger/mcp),
#                HITL policy webhook (/hitl/policy), stage UI
#   aura         AURA (mezmo/aura) agent server on Nebius Token Factory, localhost:8090 only.
#                Config: the aura-config ConfigMap (ai-sre/aura.toml + playbook.md)
#   mcp-grafana  Grafana MCP server sidecar, read-only (--disable-write), localhost only
# The prod cluster's Rollouts notifications reach this via NodePort 30808.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-sre
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-sre-data
  namespace: ai-sre
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre
  namespace: ai-sre
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ai-sre}
  template:
    metadata:
      labels: {app: ai-sre}
    spec:
      containers:
      - name: ai-sre
        image: ${AI_SRE_IMAGE}
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef: {name: ai-sre-env}
        env:
        - {name: AURA_URL, value: "http://localhost:8090"}
        # Incident memory (docs/prd-incident-memory.md). Off by default.
        - {name: INCIDENTS_ENABLED, value: "false"}
        - {name: AUTO_REVERT_PR, value: "false"}
        - {name: PROACTIVE_INVESTIGATE, value: "false"}
        - {name: GRAFANA_URL, value: "http://grafana.observability:3000"}
        - {name: GRAFANA_USERNAME, value: admin}
        - {name: GRAFANA_PASSWORD, value: admin}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        volumeMounts:
        - {name: data, mountPath: /data}
      - name: aura
        image: ${AURA_IMAGE}
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef: {name: ai-sre-env}       # NEBIUS_API_KEY, GITHUB_TOKEN, AI_SRE_MODEL
        env:
        - {name: CONFIG_PATH, value: /etc/aura/config.toml}
        - {name: HOST, value: "127.0.0.1"}
        - {name: PORT, value: "8090"}
        - {name: AURA_CUSTOM_EVENTS, value: "true"}   # aura.tool_requested etc. for the stage UI
        - {name: TOOL_RESULT_MODE, value: aura}
        - {name: TOOL_RESULT_MAX_LENGTH, value: "4000"}
        - {name: STREAMING_TIMEOUT_SECS, value: "900"}
        - {name: FIRST_CHUNK_TIMEOUT_SECS, value: "180"}
        volumeMounts:
        - {name: aura-config, mountPath: /etc/aura, readOnly: true}
      - name: mcp-grafana
        image: grafana/mcp-grafana:latest
        args: ["-t", "streamable-http", "--address", "localhost:8000",
               "--disable-write", "--disable-oncall", "--disable-incident", "--disable-alerting", "--disable-admin"]
        env:
        - {name: GRAFANA_URL, value: "http://grafana.observability:3000"}
        - {name: GRAFANA_USERNAME, value: admin}
        - {name: GRAFANA_PASSWORD, value: admin}
      volumes:
      - name: data              # the ledger and incident memory must survive restarts
        persistentVolumeClaim: {claimName: ai-sre-data}
      - name: aura-config
        configMap: {name: aura-config}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sre
  namespace: ai-sre
spec:
  type: NodePort
  selector: {app: ai-sre}
  ports:
  - {port: 8080, targetPort: 8080, nodePort: 30808}
